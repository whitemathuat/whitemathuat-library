<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt - white đọc gây</title>
<link rel="icon" type="image/png" href="../assets/icon.png">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/settings.css">
</head>
<body>
{nav}
<main class="settings">
<header class="page-head">
  <h1>cài đặt.</h1>
  <p class="script">đổi một lần, mọi máy cùng theo.</p>
</header>

<section class="paper rows">
  <!-- Một dòng cài đặt: chữ bên trái, công tắc bên phải (js/settings-page.js) -->
  <div class="row">
    <div class="row-text">
      <h2 id="show-location-label">Hiện vị trí highlight</h2>
      <p class="hint">Dòng “Loc 343” / “Trang 7” dưới mỗi ghi chú ở trang sách.</p>
    </div>
    <button class="switch" type="button" role="switch" id="show-location" data-key="show_location"
      aria-checked="true" aria-labelledby="show-location-label"><span class="knob"></span></button>
  </div>
</section>
<p class="message" id="message" role="status"></p>
</main>
{footer}
<script src="../js/settings.js"></script>
<script src="../js/settings-page.js"></script>
</body>
</html>
